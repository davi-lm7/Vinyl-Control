<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vinyl Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">

  <main class="card-login">
    <div class="logo">
      <div class="disco-icone"></div>
      <h1>Vinyl Control</h1>
    </div>
    <p class="sub">Gestão de acervo e vendas da loja de discos</p>

    <div id="msgLogin" class="mensagem"></div>

    <form id="formLogin" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
        <div class="erro-campo" id="erroEmail"></div>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password">
        <div class="erro-campo" id="erroSenha"></div>
      </div>

      <button type="submit" class="btn" id="btnEntrar">Entrar</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
