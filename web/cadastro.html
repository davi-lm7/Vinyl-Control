<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Disco - Vinyl Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <div class="logo">
      <div class="disco-icone"></div>
      <h1>Vinyl Control</h1>
    </div>
    <div class="usuario">
      <span>Olá, <strong id="nomeUsuario"></strong></span>
      <button class="btn btn-secundario btn-pequeno" id="btnSair">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <div class="titulo-pagina">
      <h2>Cadastro de Disco</h2>
      <a href="principal.html" class="btn btn-secundario" id="btnVoltar">&larr; Voltar ao início</a>
    </div>

    <!-- Formulário de cadastro / edição -->
    <section class="card">
      <h3 id="tituloForm" style="margin-bottom:14px">Novo disco</h3>
      <div id="msgForm" class="mensagem"></div>

      <form id="formDisco" novalidate>
        <input type="hidden" id="discoId">
        <div class="grade-form">
          <div class="campo">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" maxlength="150">
            <div class="erro-campo" id="erro-titulo"></div>
          </div>
          <div class="campo">
            <label for="artista">Artista / Banda *</label>
            <input type="text" id="artista" maxlength="150">
            <div class="erro-campo" id="erro-artista"></div>
          </div>
          <div class="campo">
            <label for="genero">Gênero *</label>
            <input type="text" id="genero" maxlength="50">
            <div class="erro-campo" id="erro-genero"></div>
          </div>
          <div class="campo">
            <label for="preco_custo">Preço de custo (R$) *</label>
            <input type="number" id="preco_custo" step="0.01" min="0.01">
            <div class="erro-campo" id="erro-preco_custo"></div>
          </div>
          <div class="campo">
            <label for="preco_venda">Preço de venda (R$) *</label>
            <input type="number" id="preco_venda" step="0.01" min="0.01">
            <div class="erro-campo" id="erro-preco_venda"></div>
          </div>
          <div class="campo">
            <label for="quantidade">Quantidade em estoque *</label>
            <input type="number" id="quantidade" step="1" min="0">
            <div class="erro-campo" id="erro-quantidade"></div>
          </div>
          <div class="campo">
            <label for="estoque_minimo">Estoque mínimo *</label>
            <input type="number" id="estoque_minimo" step="1" min="0">
            <div class="erro-campo" id="erro-estoque_minimo"></div>
          </div>
        </div>
        <div class="botoes-form">
          <button type="submit" class="btn" id="btnSalvar">Cadastrar</button>
          <button type="button" class="btn btn-secundario" id="btnCancelar" style="display:none">Cancelar edição</button>
        </div>
      </form>
    </section>

    <!-- Listagem com busca -->
    <section class="card">
      <h3 style="margin-bottom:14px">Discos cadastrados</h3>
      <div id="msgLista" class="mensagem"></div>

      <form class="busca" id="formBusca">
        <input type="text" id="termoBusca" placeholder="Buscar por título ou artista...">
        <button type="submit" class="btn">Buscar</button>
        <button type="button" class="btn btn-secundario" id="btnLimparBusca">Limpar</button>
      </form>

      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Título</th><th>Artista / Banda</th><th>Gênero</th><th>Preço de custo</th>
              <th>Preço de venda</th><th>Estoque</th><th>Mínimo</th><th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaDiscos">
            <tr><td colspan="9" class="vazio">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
